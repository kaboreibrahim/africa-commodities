{% for s in onglets %}
  <a class="onglet{% if societe and societe.pk == s.pk %} onglet--actif{% endif %}"
     href="{% if section == 'lignes' %}{% url 'interface:lignes' s.code %}{% elif section == 'clients' %}{% url 'interface:clients' s.code %}{% else %}{% url 'interface:tableau' s.code %}{% endif %}"
     {% if societe and societe.pk == s.pk %}aria-current="page"{% endif %}>
    <span class="point serie-{{ s.code }}" aria-hidden="true"></span>{{ s.nom }}
    {% if s.objectif_atteint %}<span class="onglet__ok" title="Objectif du mois atteint">✔<span class="visuellement-cache"> objectif atteint</span></span>{% endif %}
  </a>
{% endfor %}
