{% load static format_fr %}
<aside class="lateral" id="menu-lateral" aria-label="Menu principal">
  <a class="lateral__marque" href="{% url 'interface:accueil' %}">
    <img class="lateral__logo" src="{% static 'img/embleme-groupe.png' %}" width="42" height="42" alt="">
    <span class="lateral__nom">Africa Commodities<br>&amp; Renewables Group</span>
  </a>

  <nav aria-label="Navigation principale">
    <ul class="lateral__nav">
      {% if voit_groupe %}
        <li>
          <a class="lateral__lien" href="{% url 'interface:groupe' %}" {% if not societe and section == 'groupe' %}aria-current="page"{% endif %}>
            <span class="ico ico-groupe" aria-hidden="true"></span>Vue Groupe
          </a>
        </li>
      {% endif %}
      <li>
        <p class="lateral__titre" id="titre-societes">Sociétés</p>
        <nav class="onglets" id="onglets" aria-labelledby="titre-societes"
             hx-get="{% url 'interface:onglets' %}?actif={{ societe.code|default:'' }}&amp;section={{ section }}"
             hx-trigger="lignesModifiees from:body, objectifModifie from:body" hx-swap="innerHTML">
          {% include "partials/onglets.html" %}
        </nav>
      </li>
      <li>
        <a class="lateral__lien" href="{% url 'interface:regle' %}" {% if section == 'regle' %}aria-current="page"{% endif %}>
          <span class="ico ico-regle" aria-hidden="true"></span>Règle de répartition
        </a>
      </li>
      {% if peut_administrer %}
        <li>
          <a class="lateral__lien" href="{% url 'interface:habilitations' %}" {% if section == 'habilitations' %}aria-current="page"{% endif %}>
            <span class="ico ico-habilitations" aria-hidden="true"></span>Habilitations
          </a>
        </li>
      {% endif %}
    </ul>
  </nav>

  <div class="lateral__bas">
    <a class="lateral__lien" href="{% url 'account_logout' %}">
      <span class="ico ico-sortie" aria-hidden="true"></span>Déconnexion
    </a>
  </div>
</aside>
