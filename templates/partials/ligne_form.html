<form id="form-ligne" class="carte no-print" method="post" action="{% url 'interface:lignes' societe.code %}"
      hx-post="{% url 'interface:lignes' societe.code %}" hx-target="this" hx-swap="outerHTML">
  <h2>Enregistrer : {{ societe.libelle_ligne }}</h2>
  {% csrf_token %}
  {% include "partials/ligne_champs.html" with prefixe="ajout-" %}
  <div class="formulaire__actions">
    <button type="submit">+ Ajouter</button>
  </div>
</form>
